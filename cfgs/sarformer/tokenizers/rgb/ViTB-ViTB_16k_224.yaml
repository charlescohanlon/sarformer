run_name: auto

# Architecture
encoder_type: vit_b_enc
decoder_type: vit_b_dec
input_size_min: 224
input_size_max: 224
resolution_step: 1 # used as step in range to produce [input_size, input_size + resolution_step)
patch_size: 16 # encoder ViT patch size
post_mlp: True # tanh MLP before quantizer, see ViT-VQGAN paper
out_conv: False # don't care that much about reconstruction quality

# Quantizer
codebook_size: 16_384
latent_dim: 32
norm_codes: True
codebook_weight: 1.0
quantizer_type: lucid
coef_ema_dead_code: 32.0
code_replacement_policy: batch_random
commitment_weight: 1.0
quantizer_ema_decay: 0.99
kmeans_init: False

# Losses
loss_fn: mse
codebook_weight: 1.0
orthogonal_reg_weight: 1.0 # for translation invariance

# Train
dtype: bf16 # fp32, fp16 or bf16
warmup_epochs: 100
epochs: 1000
opt: adamw
opt_betas: [0.9, 0.99]
blr: 0.0001 # base_lr = 1e-4, lr = base_lr * batch_size / 256
warmup_lr: 0.000001 # 1e-6
min_lr: 0.
batch_size: 232 # per GPU
save_ckpt_freq: 100 # in epochs
weight_decay: 0.05 # the default
find_unused_params: False
model_ema: False

# Eval
step_eval: False
epoch_eval: True
eval_freq: 100
eval_metrics_freq: 100
eval_image_log_freq: 250
num_eval_metrics_samples: 400 # Number of samples to use for evaluating image metrics during training.
num_logged_images: 9
input_size_eval: 224
dist_eval: True
log_fid_last_epoch: True # only computes FID for the last epoch

# Augmentation
hflip: 0.5
vflip: 0.5

# Data
mask_value: 0
domain: rgb
mean_and_std: naip
data_path: '/scratch/bdej/cohanlon/data/train'
eval_data_path: '/scratch/bdej/cohanlon/data/eval'

# Logging
log_wandb: True
wandb_project: rgb_tokenizer
wandb_entity: sarformer
wandb_run_name: auto
output_dir: '/scratch/bdej/cohanlon/checkpoints/auto'
log_codebook_usage: True
show_user_warnings: False

# Misc.
device: cuda
num_workers: 119
cache_datasets: False