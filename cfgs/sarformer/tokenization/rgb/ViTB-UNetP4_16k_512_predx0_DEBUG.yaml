run_name: test

# Architecture
encoder_type: vit_b_enc
decoder_type: unet_patched
input_size_min: 512
input_size_max: 512
resolution_step: 1 # used as step in range to produce [512, 513)
patch_size: 16 # encoder ViT patch size
patch_size_dec: 4 # Patched UNet decoder patch size
post_mlp: True # tanh MLP before quantizer, see ViT-VQGAN paper

# Quantizer
codebook_size: 16_384
latent_dim: 32
norm_codes: True
codebook_weight: 1.0
quantizer_type: lucid
coef_ema_dead_code: 32.0
code_replacement_policy: batch_random
commitment_weight: 1.0
quantizer_ema_decay: 0.99
kmeans_init: False
orthogonal_reg_weight: 1.0 # just to be explicit

# Diffusion
num_train_timesteps: 1000 # number of diffusion steps during training
prediction_type: sample # diffusion target
beta_schedule: linear # noise schedule
cls_free_guidance_dropout: 0.0 # How often to drop out the conditioning
masked_cfg: False # Randomly mask out the tokens when using conditioning dropout
clip_sample: True # Only for logged images
loss_fn: mse
resolution_cond: False

# Train
dtype: bf16 # fp32, fp16 or bf16
epochs: 1
opt: adamw
opt_betas: [0.9, 0.99]
blr: 0.0001 # base_lr = 1e-4, lr = base_lr * batch_size / 256
warmup_lr: 0.000001 # 1e-6
min_lr: 0.
warmup_epochs: 0
batch_size: 64 # per GPU
model_ema: True
model_ema_decay: 0.9999
model_ema_update_freq: 12 # in iterations
find_unused_params: True
save_ckpt_freq: 12 # in epochs
weight_decay: 0.05 # the default

# Eval
step_eval: True
epoch_eval: False
eval_freq: 5000
eval_metrics_freq: 5000
eval_image_log_freq: 5000
num_eval_metrics_samples: 5000 # Number of samples to use for evaluating image metrics during training.
num_logged_images: 100
eval_noise_schedule: DDIMScheduler
num_eval_timesteps: 50
input_size_eval: 512
dist_eval: True
no_inception: True # Uses a classifier but we have no (comprehensible) labels

# Augmentation
use_random_rotations: True
near_orthogonal: True
rotation_resample_mode: bicubic

# Data
mask_value: 0
domain: rgb
mean_and_std: naip # we changed the functionaity of the imagenet_default_mean_and_std arg
data_path: '/scratch/bdej/cohanlon/unlabeled/train'
eval_data_path: '/scratch/bdej/cohanlon/unlabeled/eval'

# Logging
log_wandb: True
wandb_project: rgb_tokenization
wandb_entity: sarformer
wandb_run_name: auto
output_dir: 'output/rgb_tokenizer'
log_coebook_usage: True
show_user_warnings: False

# Misc.
device: "cuda"
num_workers: 16 # should match num of cpu cores planned to use
cache_datasets: False
